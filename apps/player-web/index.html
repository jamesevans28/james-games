<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Ensure relative module imports resolve correctly on nested routes -->
    <!-- %BRAND.*% placeholders are filled from src/config/brand.json by the brand-html plugin in vite.config.ts -->
    <link rel="icon" type="image/svg+xml" href="%BRAND.logoMark%" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-32.png" />
    <link rel="apple-touch-icon" href="/brand/icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="%BRAND.name%" />
    <meta name="theme-color" content="%BRAND.themeColor%" />
    <!-- The PWA plugin injects the manifest link at build time -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&family=Patrick+Hand&display=swap"
      rel="stylesheet"
    />
    <title>%BRAND.name% | %BRAND.tagline%</title>
    <meta name="description" content="%BRAND.description%" />
    <meta name="author" content="%BRAND.makersLine%" />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <link rel="canonical" href="%BRAND.origin%/" />
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%BRAND.name%" />
    <meta property="og:locale" content="en_AU" />
    <meta property="og:title" content="%BRAND.name% | %BRAND.tagline%" />
    <meta property="og:description" content="%BRAND.description%" />
    <meta property="og:url" content="%BRAND.origin%/" />
    <meta property="og:image" content="%BRAND.origin%%BRAND.ogImage%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%BRAND.name%" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%BRAND.name% | %BRAND.tagline%" />
    <meta name="twitter:description" content="%BRAND.description%" />
    <meta name="twitter:image" content="%BRAND.origin%%BRAND.ogImage%" />
    <!-- Structured data: WebSite + Organization (brand-html plugin) -->
    <!-- %BRAND_JSONLD% -->
    <!-- Cloudflare Web Analytics (cookieless), production builds with brand.analyticsId set (brand-html plugin) -->
    <!-- %BRAND_ANALYTICS% -->
  </head>

  <body class="min-h-screen bg-paper text-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
