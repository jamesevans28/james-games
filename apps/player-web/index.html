<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Ensure relative module imports resolve correctly on nested routes -->
    <!-- %BRAND.*% placeholders are filled from src/config/brand.json by the brand-html plugin in vite.config.ts -->
    <link rel="icon" type="image/svg+xml" href="%BRAND.logoMark%" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-32.png" />
    <link rel="apple-touch-icon" href="/brand/icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="%BRAND.name%" />
    <meta name="theme-color" content="%BRAND.themeColor%" />
    <!-- The PWA plugin injects the manifest link at build time -->
    <!-- Tags marked data-default-seo are the home page's, for crawlers that don't run
         JavaScript. src/main.tsx removes them on boot so each page's <Seo> is the only set
         (the title stays: React 19 puts each page's <title> first). -->
    <title>%BRAND.name% | %BRAND.tagline%</title>
    <meta data-default-seo name="description" content="%BRAND.description%" />
    <meta data-default-seo name="author" content="%BRAND.makersLine%" />
    <meta
      data-default-seo
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <link data-default-seo rel="canonical" href="%BRAND.origin%/" />
    <!-- Open Graph -->
    <meta data-default-seo property="og:type" content="website" />
    <meta data-default-seo property="og:site_name" content="%BRAND.name%" />
    <meta data-default-seo property="og:locale" content="en_AU" />
    <meta data-default-seo property="og:title" content="%BRAND.name% | %BRAND.tagline%" />
    <meta data-default-seo property="og:description" content="%BRAND.description%" />
    <meta data-default-seo property="og:url" content="%BRAND.origin%/" />
    <meta data-default-seo property="og:image" content="%BRAND.origin%%BRAND.ogImage%" />
    <meta data-default-seo property="og:image:width" content="1200" />
    <meta data-default-seo property="og:image:height" content="630" />
    <meta data-default-seo property="og:image:alt" content="%BRAND.name%" />
    <!-- Twitter Card -->
    <meta data-default-seo name="twitter:card" content="summary_large_image" />
    <meta data-default-seo name="twitter:title" content="%BRAND.name% | %BRAND.tagline%" />
    <meta data-default-seo name="twitter:description" content="%BRAND.description%" />
    <meta data-default-seo name="twitter:image" content="%BRAND.origin%%BRAND.ogImage%" />
    <!-- Structured data: WebSite + Organization (brand-html plugin) -->
    <!-- %BRAND_JSONLD% -->
  </head>

  <body class="min-h-screen bg-paper text-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
