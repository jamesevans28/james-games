name: Database backup

# T9.6. Nightly pg_dump of Supabase to S3 (30-day lifecycle on the bucket).
# Needs: secret DATABASE_URL_MIGRATIONS (session pooler, pg_dump needs a real session),
# variable BACKUP_BUCKET, and the OIDC role allowed s3:PutObject on that bucket.
# Skips itself until DATABASE_URL_MIGRATIONS and BACKUP_BUCKET exist.
on:
  schedule:
    - cron: "43 15 * * *" # 01:43 AEST
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL_MIGRATIONS: ${{ secrets.DATABASE_URL_MIGRATIONS }}
      BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
    steps:
      - name: Skip when not configured
        id: gate
        run: |
          if [ -z "$DATABASE_URL_MIGRATIONS" ] || [ -z "$BACKUP_BUCKET" ]; then
            echo "::notice::DATABASE_URL_MIGRATIONS or BACKUP_BUCKET not set; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dump
        if: steps.gate.outputs.skip != 'true'
        run: |
          docker run --rm -e PGURL="$DATABASE_URL_MIGRATIONS" postgres:17 \
            sh -c 'pg_dump "$PGURL" --format=custom --no-owner --no-privileges' > db.dump
          test -s db.dump
          ls -l db.dump

      - name: Configure AWS credentials (OIDC)
        if: steps.gate.outputs.skip != 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload
        if: steps.gate.outputs.skip != 'true'
        run: aws s3 cp db.dump "s3://$BACKUP_BUCKET/db/$(date -u +%Y-%m-%d).dump" --only-show-errors
