name: Deploy admin

# Manual until relaunch (T13.4 uncomments the push trigger).
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths: ["apps/admin-web/**", "package.json", "package-lock.json"]

permissions:
  id-token: write # GitHub OIDC → AWS
  contents: read

concurrency:
  group: deploy-admin
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ADMIN_S3_BUCKET: ${{ vars.ADMIN_S3_BUCKET }}
  ADMIN_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.ADMIN_CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  gate:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build admin
        run: npm run admin:build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: aws s3 sync ./apps/admin-web/dist "s3://$ADMIN_S3_BUCKET" --delete --follow-symlinks

      - name: Cache-Control
        run: |
          if [ -d "apps/admin-web/dist/assets" ]; then
            aws s3 cp ./apps/admin-web/dist/assets "s3://$ADMIN_S3_BUCKET/assets" \
              --recursive \
              --metadata-directive REPLACE \
              --cache-control "public, max-age=31536000, immutable"
          fi
          aws s3 cp "s3://$ADMIN_S3_BUCKET/index.html" "s3://$ADMIN_S3_BUCKET/index.html" \
            --metadata-directive REPLACE \
            --cache-control "no-store, no-cache, must-revalidate, max-age=0" \
            --content-type text/html

      - name: Invalidate CloudFront
        if: ${{ env.ADMIN_CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$ADMIN_CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/" "/index.html"
