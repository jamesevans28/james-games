name: Release

# T9.9. By hand: Actions → Release → Run workflow → patch / minor / major.
# Tags main as vX.Y.Z with notes grouped from conventional commits. The tag is the
# version: deploy-web reads it for the drawer's "Build" line. (Tags made with the
# workflow token don't trigger other workflows; run "Build Android" by hand on the tag.)
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        options: [patch, minor, major]
        default: minor

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Notes
        id: notes
        run: |
          node scripts/release-notes.mjs "${{ inputs.bump }}" > release.txt
          echo "version=$(head -1 release.txt)" >> "$GITHUB_OUTPUT"
          tail -n +2 release.txt > notes.md
          cat notes.md

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.notes.outputs.version }}" \
            --target "${{ github.sha }}" \
            --title "Games4James ${{ steps.notes.outputs.version }}" \
            --notes-file notes.md
