name: CI

# Gates for every PR and every push to main (T9.1). The deploy workflows call
# this one first (workflow_call), so nothing ships that fails here.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # A production build refuses to run without an API origin; CI only checks it builds.
      - name: Build player web
        run: npm run web:build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://api.games4james.com' }}

      # T9.7: every PR's player-web build as a downloadable artifact (open dist/index.html via `npx vite preview`).
      - name: Upload player web build (PRs)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: player-web-dist
          path: apps/player-web/dist
          retention-days: 7

      - name: Build admin
        run: npm run admin:build

      - name: Build API
        run: npm run backend:build
